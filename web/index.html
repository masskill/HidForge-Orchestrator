<!doctype html>
<html lang="uk" data-hf-style="obsidian-orange" data-hf-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hidforge-token" content="__HIDFORGE_TOKEN__">
  <title>HidForge Orchestrator</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/ui.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- AppShell: sidebar (brand, project switcher, navigation, connection) + main column (topbar, page) -->
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Навігація">
      <div class="brand" id="brand"><div>HidForge<small>Orchestrator</small></div></div>
      <div>
        <div class="side-label">Проєкт</div>
        <div class="row" style="flex-wrap:nowrap">
          <select id="projectSel" class="select" aria-label="Поточний проєкт"></select>
          <span id="addProjectSlot"></span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Розділи"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <span id="menuSlot"></span>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <div class="row" id="topActions"></div>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
